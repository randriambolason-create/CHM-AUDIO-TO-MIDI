
name: CHM Audio to MIDI - Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Verify dependencies
        shell: pwsh
        run: |
          python -c "import tkinter, pyaudio, numpy, scipy, librosa, mido, rtmidi, click, rich, questionary; print('Dependencies OK')"

      - name: Verify source CLI
        shell: pwsh
        run: |
          chcp 65001
          python -m audio_to_midi.main --help
          if ($LASTEXITCODE -ne 0) {
            throw "Source CLI verification failed"
          }

      - name: Create fixed Windows launcher
        shell: pwsh
        run: |
          @'
          import os
          import sys

          os.environ["PYTHONIOENCODING"] = "utf-8"
          os.environ["PYTHONUTF8"] = "1"

          def configure_console():
              for stream in (sys.stdout, sys.stderr):
                  if stream is not None:
                      if hasattr(stream, "reconfigure"):
                          stream.reconfigure(
                              encoding="utf-8",
                              errors="replace"
                          )

          configure_console()

          from audio_to_midi.main import main

          if __name__ == "__main__":
              if len(sys.argv) == 1:
                  sys.argv.append("run")

              main()
          '@ | Set-Content -Path "chm_launcher.py" -Encoding utf8

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --console `
            --name "CHM-Audio-to-MIDI" `
            --collect-submodules "audio_to_midi" `
            --collect-submodules "librosa" `
            --collect-submodules "mido.backends" `
            --collect-all "soundfile" `
            --collect-all "scipy" `
            --collect-all "numba" `
            chm_launcher.py

      - name: Verify built EXE
        shell: pwsh
        run: |
          chcp 65001

          $exe = "dist/CHM-Audio-to-MIDI/CHM-Audio-to-MIDI.exe"

          if (!(Test-Path $exe)) {
            throw "EXE not found"
          }

          Write-Host "Testing compiled executable"

          & $exe --help

          if ($LASTEXITCODE -ne 0) {
            throw "Compiled EXE test failed"
          }

          Write-Host "EXE CLI test passed"

      - name: Package Windows application
        shell: pwsh
        run: |
          $folder = "dist/CHM-Audio-to-MIDI"

          if (!(Test-Path $folder)) {
            throw "Build folder missing"
          }

          Compress-Archive `
            -Path "$folder/*" `
            -DestinationPath "CHM-Audio-to-MIDI-Windows.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHM-Audio-to-MIDI-Windows
          path: CHM-Audio-to-MIDI-Windows.zip
          if-no-files-found: error
          retention-days: 30
