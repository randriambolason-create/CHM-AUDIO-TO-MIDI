
name: CHM Audio to MIDI - Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Configure UTF-8
        shell: pwsh
        run: |
          chcp 65001
          "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
          "PYTHONUTF8=1" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Verify Python dependencies
        shell: pwsh
        run: |
          python -c "import tkinter, pyaudio, numpy, scipy, librosa, mido, rtmidi, click, rich, questionary; print('Dependencies OK')"
          python -m audio_to_midi.main --help

      - name: Create Windows launcher
        shell: pwsh
        run: |
          @'
          import os
          import sys

          os.environ["PYTHONIOENCODING"] = "utf-8"
          os.environ["PYTHONUTF8"] = "1"

          from audio_to_midi.main import main

          if __name__ == "__main__":
              if len(sys.argv) == 1:
                  sys.argv.append("run")
              main()
          '@ | Set-Content -Path "chm_launcher.py" -Encoding utf8

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --console `
            --name "CHM-Audio-to-MIDI" `
            --collect-submodules "audio_to_midi" `
            --collect-submodules "librosa" `
            --collect-submodules "mido.backends" `
            --collect-all "soundfile" `
            --collect-all "scipy" `
            --collect-all "numba" `
            chm_launcher.py

      - name: Smoke test EXE
        shell: pwsh
        run: |
          chcp 65001
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"

          $exe = "dist/CHM-Audio-to-MIDI/CHM-Audio-to-MIDI.exe"

          if (!(Test-Path $exe)) {
            throw "Executable not found"
          }

          & $exe --help

          if ($LASTEXITCODE -ne 0) {
            throw "EXE smoke test failed"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHM-Audio-to-MIDI-Windows
          path: dist/CHM-Audio-to-MIDI/
          if-no-files-found: error
          retention-days: 30
